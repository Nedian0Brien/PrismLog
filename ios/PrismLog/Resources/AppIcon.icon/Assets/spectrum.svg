<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The split beam carries most of the icon's color. Inside the glass the bands
    run tight and dimmed; at the exit face each kinks outward — that change of
    direction is what reads as refraction.

    All aperture points sit exactly on a face:
      left:  x = 310 - (y - 190) * 0.411765   (leans back as it descends)
      right: x = 310 + (y - 190) * 0.411765

    Colors and order match the dashboard ring and the wordmark: 독서 · 공부 · 문화.
  -->
  <!-- Inside the glass. -->
  <g opacity="0.5">
    <path d="M227.6 390 L417.1 450 L439.7 505 L222.7 402 Z" fill="#2DB5A3"/>
    <path d="M222.7 402 L439.7 505 L462.4 560 L217.8 414 Z" fill="#F0C930"/>
    <path d="M217.8 414 L462.4 560 L485 615 L212.8 426 Z" fill="#E63946"/>
  </g>

  <!-- Past the exit face: full strength, running off the canvas. -->
  <path d="M417.1 450 L1120 170 L1120 450 L439.7 505 Z" fill="#2DB5A3"/>
  <path d="M439.7 505 L1120 450 L1120 730 L462.4 560 Z" fill="#F0C930"/>
  <path d="M462.4 560 L1120 730 L1120 1010 L485 615 Z" fill="#E63946"/>
</svg>
