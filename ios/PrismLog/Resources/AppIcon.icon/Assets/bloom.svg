<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    A soft pool of category light behind the mark, so the dark field carries a
    tint instead of reading as flat black. Same device as the app's
    `SpectrumBloomBackground`.
  -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FD4BF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#2DB5A3" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#2DB5A3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="512" cy="470" r="560" fill="url(#glow)"/>
</svg>
