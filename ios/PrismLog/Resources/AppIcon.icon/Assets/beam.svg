<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    White light arriving from off-canvas, ending flush on the prism's left face
    at the same aperture the spectrum fans out of.
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-10 512 512)">
    <path d="M-140 486 L338 505 L352 536 L-140 556 Z" fill="url(#beam)"/>
  </g>
</svg>
