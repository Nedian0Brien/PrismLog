<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    White light arriving from off-canvas. Its right edge is the entry aperture
    itself — the same two points the spectrum fans out of — so the beam stops
    exactly on the glass instead of overshooting it.
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <path d="M-140 368 L227.6 390 L212.8 426 L-140 450 Z" fill="url(#beam)"/>
</svg>
