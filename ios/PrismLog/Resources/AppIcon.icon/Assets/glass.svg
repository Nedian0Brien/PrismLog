<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The glass itself: a diagonal sheen across the body and a lit edge. Kept as
    its own layer so the system's Liquid Glass treatment can give it depth
    separately from the colour underneath.
  -->
  <defs>
    <clipPath id="tri">
      <path d="M512 168 L878 812 L146 812 Z"/>
    </clipPath>
    <linearGradient id="sheen" x1="0.15" y1="0" x2="0.75" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.42"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tri)">
    <path d="M512 168 L878 812 L146 812 Z" fill="url(#sheen)"/>
  </g>
  <path d="M512 168 L878 812 L146 812 Z"
        fill="none" stroke="url(#edge)" stroke-width="18" stroke-linejoin="round"/>
</svg>
