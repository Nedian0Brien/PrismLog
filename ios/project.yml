name: PrismLog

options:
  bundleIdPrefix: kr.lawdigest
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # Shared by the app and the widget — an extension whose CFBundleVersion
    # differs from its host is rejected at install time.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_ASSET_PATHS: ""

targets:
  PrismLog:
    type: application
    platform: iOS
    sources:
      - path: PrismLog
        excludes:
          - "Resources/AppIcon.icon"
      # An Icon Composer document is a bundle, not a folder of loose SVGs —
      # without `type: file` the generator adds each layer individually and
      # actool never sees an icon.
      - path: PrismLog/Resources/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lawdigest.prismlog
        PRODUCT_NAME: PrismLog
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: Support/PrismLog.entitlements
    dependencies:
      - target: PrismLogWidget
        embed: true

  PrismLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PrismLogWidget
      # Shared with the app so the widget speaks the same colors and reads the
      # same snapshot file.
      - path: PrismLog/DesignSystem/PrismPalette.swift
      - path: PrismLog/Shared/SpectrumSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lawdigest.prismlog.widget
        PRODUCT_NAME: PrismLogWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Support/PrismLogWidget.entitlements
        SKIP_INSTALL: YES

  PrismLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrismLogTests
    dependencies:
      - target: PrismLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lawdigest.prismlog.tests
        GENERATE_INFOPLIST_FILE: YES

  PrismLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrismLogUITests
    dependencies:
      - target: PrismLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lawdigest.prismlog.uitests
        TEST_TARGET_NAME: PrismLog
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PrismLog:
    build:
      targets:
        PrismLog: all
        PrismLogTests: [test]
        PrismLogUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrismLogTests
        - PrismLogUITests
    archive:
      config: Release
