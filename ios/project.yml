name: PrismLog

options:
  bundleIdPrefix: kr.lawdigest
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_ASSET_PATHS: ""

targets:
  PrismLog:
    type: application
    platform: iOS
    sources:
      - path: PrismLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lawdigest.prismlog
        PRODUCT_NAME: PrismLog
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  PrismLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrismLogUITests
    dependencies:
      - target: PrismLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lawdigest.prismlog.uitests
        TEST_TARGET_NAME: PrismLog
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PrismLog:
    build:
      targets:
        PrismLog: all
        PrismLogUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrismLogUITests
    archive:
      config: Release
