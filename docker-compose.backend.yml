services:
  prismlog-postgres:
    image: postgres:16
    container_name: prismlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prismlog
      POSTGRES_USER: prismlog
      POSTGRES_PASSWORD: prismlog_change_me
    ports:
      - "5433:5432"
    volumes:
      - prismlog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prismlog -d prismlog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prismlog-net

  prismlog-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prismlog-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: PrismLog API
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://prismlog:prismlog_change_me@prismlog-postgres:5432/prismlog
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      prismlog-postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - prismlog-net

volumes:
  prismlog_pg_data:

networks:
  prismlog-net:
    name: prismlog-net
